[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pommes-eur"
version = "0.1.0"
description = "General European power/hydrogen energy-system model on the POMMES framework (CLEVER-2050 as one case study)"
requires-python = ">=3.11"
dependencies = [
    "platformdirs",              # import-time (pommes_eur/__init__.py)
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "xarray",
    "hdf5plugin",                # NetCDF/HDF5 codecs (xarray/pommes IO)
    "python-dotenv",             # supplyforge reads a .env for the ENTSO-E token
]

# The POMMES optimisation framework is on PyPI; install the `solver` extra to build/solve
# the LP. The data packages supplyforge/demandforge are path-vendored in this repo (add
# them to PYTHONPATH — see README). A full solve additionally needs a Gurobi license and
# the CLEVER data caches, which live on the cluster.
[project.optional-dependencies]
solver = [
    "pommes_craft",
    "pommes",
]

[tool.setuptools]
# Explicit package list (not auto-find) so tests/, results/, notebooks/ and the vendored
# supplyforge/demandforge trees are never packaged. This list doubles as the reorg
# checklist — extend it as concern subpackages are added (data/, costs/, sources/,
# model/, model/techs/, solve/). `clever` MUST stay listed or `import clever` breaks
# after an install.
packages = [
    "pommes_eur",
    "pommes_eur.scenario",
    "pommes_eur.data",
    "pommes_eur.costs",
    "pommes_eur.sources",
    "pommes_eur.model",
    "pommes_eur.model.techs",
    "pommes_eur.solve",
    "pommes_eur.providers",
    "pommes_eur.providers.clever",
    "clever",
]
